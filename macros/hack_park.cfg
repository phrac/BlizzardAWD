[gcode_macro HACK_PARK]
description: Parks toolhead at Back-Left for straightest filament path during tip forming
gcode:
    # --- Configuration ---
    {% set speed = 18000 %}      # Travel speed (300mm/s)
    {% set z_hop = 2 %}          # Relative Z-hop to clear print
    {% set pad = 5 %}            # Safety margin from bed edge (mm)

    # --- Logic ---
    {% if "xyz" in printer.toolhead.homed_axes %}
        SAVE_GCODE_STATE NAME=HACK_PARK_STATE

        # 1. Calculate Back Left Coordinates
        # Trident Origin (0,0) is Front Left.
        # Target: X = Min + Padding, Y = Max - Padding
        {% set x_park = printer.toolhead.axis_minimum.x + pad %}
        {% set y_park = printer.toolhead.axis_maximum.y - pad %}
        
        # 2. Safety: Get Max Z to avoid crashing into ceiling
        {% set max_z = printer.toolhead.axis_maximum.z %}
        {% set current_z = printer.toolhead.position.z %}
        
        # 3. Perform Park
        G91                       ; Relative positioning
        {% if current_z < (max_z - z_hop) %}
            G1 Z{z_hop} F900      ; Z-hop if safe
        {% endif %}
        
        G90                       ; Absolute positioning
        G1 X{x_park} Y{y_park} F{speed}
        M400                      ; Wait for move to finish

        # 4. Restore State (Restores speed/modes, but KEEPS toolhead at park)
        RESTORE_GCODE_STATE NAME=HACK_PARK_STATE MOVE=0
    {% else %}
        {action_respond_info("Printer not homed. HACK_PARK skipped.")}
    {% endif %}