[homing_override]
axes: z                    # Override homing for the Z axis only
set_position_z: 0           # Set the Z position to 0 after homing
gcode:
    G90                     # Set to absolute positioning mode
    G0 Z10 F1200            # Move Z axis to 10mm above the bed at 1200 mm/min
    G28 Y                   # Home Y axis
    G28 X                   # Home X axis
    G1 X150 Y150 F7200      # Move to a specific coordinate (125, 125) at 7200 mm/min
    G28 Z                   # Home Z axis again
    G1 Z10

####################################################################################
##                                    Z Tilt Adjustment
####################################################################################
[z_tilt_ng]
#z_positions:
#  -50, 18
#  150, 348
#  350, 18
points:
  50, 50
  150, 250
  250, 50

speed: 300                 # Speed of Z tilt adjustment
horizontal_move_z: 2       # Z axis move speed for adjustments
retries: 10                # Number of retries for adjustment points
retry_tolerance: 0.005    # Retry tolerance for adjustment accuracy

####################################################################################
##                                    Temp Sensors
####################################################################################
[temperature_sensor chamber_lower]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5

#[temperature_sensor chamber_upper]
#sensor_type: NTC 100K MGB18-104F39050L32
#sensor_pin: PB0

#[temperature_sensor chamber]
#sensor_type: temperature_combined
#sensor_list: temperature_sensor chamber_lower,temperature_sensor chamber_upper
#combination_method: mean
#maximum_deviation: 999.9

#####################################################################
##                  Chamber Heater
#####################################################################
[temperature_sensor chamber_heater_temp] #this is the temp sensor for the 10K probe inserted in the heater core
sensor_type: NTC 100K MGB18-104F39050L32   #use temp sensor characteristics as defined in "heater_thermistor"
sensor_pin: PC4                  #Manta 8P temp sensor input pin. This temp probe is glued to the heater core with UV resin
min_temp: -100                   #set minimum temp before error/shutdown
max_temp: 150                    #SAFETY max heater core temperature, printer will shutdown above this temp

[heater_generic chamber_heater]  #setup chamber heater
heater_pin: PA5                  #Manta 8P heater output pin to SSR. This temp probe is mounted near the top of my chamber
#sensor_type:   #use temp sensor characteristics as defined in "chamber_thermistor"
#sensor_pin: PA1                  #Manta *P temp sensor input pin
#sensor_type: 
#sensor_list: temperature_sensor chamber_lower,temperature_sensor chamber_upper
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
#maximum_deviation: 999.0
#combination_method: mean
control: pid                           # Control method
## Chamber heater temperature PID calibration command: "PID_CALIBRATE HEATER=chamber_heater TARGET=60"
pid_kp: 22.2                          # PID Kp value (will need calibration)
pid_ki: 1.08                          # PID Ki value (will need calibration)
pid_kd: 114                           # PID Kd value (will need calibration)
min_temp: -100                   #set minimum temp before error/shutdown
max_temp: 70                     #SAFETY max chamber temperature, printer will shutdown above this temp
pwm_cycle_time: 0.01666          #Set this to avoid room lights flickering on higher power heaters. This value works well for 60Hz power. 0.1 is 10Hz

[verify_heater chamber_heater]   #setup chamber heater verification parameters
max_error: 120
check_gain_time: 240
hysteresis: 5
heating_gain: 1

[heater_fan chamber_fan]         #setup fan attached to back of chamber heater
pin: PA4                        #Manta 8P fan output pin. Jumper selected for 12V
max_power: 1.0                  #set maximum power of fan 1.0 = 100%
heater: chamber_heater          #when "chamber_heater" is ON fan will  be ON
heater_temp: 30                 #fan will turn off below this level

